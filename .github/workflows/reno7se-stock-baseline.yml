name: Reno7 SE F.06 Stock Baseline

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reno7se-stock-baseline.yml'
      - 'config/reno7se-stock-baseline.env'
      - 'config/PFCM00-F06-stock-kernel.config'
      - 'scripts/stock-baseline.sh'
      - 'scripts/prepare_stock.py'
      - 'tools/stock_boot.py'
      - 'boot/boot.img'

permissions:
  contents: read

concurrency:
  group: reno7se-stock-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      WORKSPACE: ${{ github.workspace }}/kernel_workspace
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates curl flex git \
            libelf-dev libncurses-dev libssl-dev libtinfo5 openssl python3 xz-utils
      - name: Test boot verifier against the supplied stock image
        run: |
          source config/reno7se-stock-baseline.env
          mkdir -p kernel_workspace/toolchains
          curl --fail --location --retry 6 --retry-all-errors \
            "https://android.googlesource.com/platform/external/avb/+/$AVB_REVISION/avbtool.py?format=TEXT" \
            | base64 --decode > kernel_workspace/toolchains/avbtool.py
          AVBTOOL="$PWD/kernel_workspace/toolchains/avbtool.py" \
            python3 -m unittest discover -s tests -v
      - name: Build pure stock baseline and verified boot image
        run: bash scripts/stock-baseline.sh
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Reno7SE-F06-stock-baseline-${{ github.run_number }}
          path: kernel_workspace/artifacts/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
