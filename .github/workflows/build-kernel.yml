name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      config:
        description: "Config file to build"
        required: false
        default: "config/reno7se-mt6877.env"
        type: string

      ksu_variant:
        description: "KernelSU variant"
        required: false
        default: "config"
        type: choice
        options:
          - config
          - none
          - kernelsu
          - kernelsu-next
          - sukisu-ultra
          - resukisu
          - rsuntk
          - backslashxx

      ksu_ref:
        description: "KernelSU branch/tag/commit"
        required: false
        default: ""
        type: string

      hook_mode:
        description: "KernelSU hook mode"
        required: false
        default: "config"
        type: choice
        options:
          - config
          - auto
          - kprobes
          - manual
          - tracepoint
          - syscall
          - none

      susfs:
        description: "Enable SUSFS"
        required: false
        default: "config"
        type: choice
        options:
          - config
          - "true"
          - "false"

      path_umount:
        description: "Enable path_umount backport"
        required: false
        default: "config"
        type: choice
        options:
          - config
          - "true"
          - "false"

      hide_stuff:
        description: "Enable hide_stuff"
        required: false
        default: "config"
        type: choice
        options:
          - config
          - "true"
          - "false"

      kpm:
        description: "Enable KPM"
        required: false
        default: "config"
        type: choice
        options:
          - config
          - "true"
          - "false"

      extra_defconfig:
        description: "Extra defconfig options"
        required: false
        default: ""
        type: string

      publish_release:
        description: "Publish GitHub Release"
        required: false
        default: false
        type: boolean

  workflow_call:
    inputs:
      config:
        required: false
        default: "config/reno7se-mt6877.env"
        type: string

      ksu_variant:
        required: false
        default: "config"
        type: string

      ksu_ref:
        required: false
        default: ""
        type: string

      hook_mode:
        required: false
        default: "config"
        type: string

      susfs:
        required: false
        default: "config"
        type: string

      path_umount:
        required: false
        default: "config"
        type: string

      hide_stuff:
        required: false
        default: "config"
        type: string

      kpm:
        required: false
        default: "config"
        type: string

      extra_defconfig:
        required: false
        default: ""
        type: string

      publish_release:
        required: false
        default: false
        type: boolean


concurrency:
  group: reno7se-kernel-${{ github.ref }}-${{ inputs.config }}
  cancel-in-progress: true


permissions:
  contents: read


jobs:
  build:
    name: Build Reno7 SE MT6877

    runs-on: ubuntu-22.04
    timeout-minutes: 120

    outputs:
      device: ${{ steps.meta.outputs.device }}
      build_time: ${{ steps.meta.outputs.build_time }}
      ksu_name: ${{ steps.meta.outputs.ksu_name }}
      ksu_version: ${{ steps.meta.outputs.ksu_version }}
      kernel_release: ${{ steps.meta.outputs.kernel_release }}
      susfs_version: ${{ steps.meta.outputs.susfs_version }}

    env:
      WORKSPACE: ${{ github.workspace }}/kernel_workspace

      CONFIG_ENV: ${{ inputs.config }}

      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

      IN_KSU_VARIANT: ${{ inputs.ksu_variant }}
      IN_KSU_REF: ${{ inputs.ksu_ref }}
      IN_KSU_HOOK_MODE: ${{ inputs.hook_mode }}
      IN_ENABLE_SUSFS: ${{ inputs.susfs }}
      IN_ENABLE_PATH_UMOUNT: ${{ inputs.path_umount }}
      IN_ENABLE_HIDE_STUFF: ${{ inputs.hide_stuff }}
      IN_ENABLE_KPM: ${{ inputs.kpm }}
      IN_EXTRA_DEFCONFIG: ${{ inputs.extra_defconfig }}

    steps:

      # ========================================================
      # Checkout KernelSU_Action
      # ========================================================

      - name: Checkout KernelSU Action
        uses: actions/checkout@v4
        with:
          fetch-depth: 1


      # ========================================================
      # Resolve config
      # ========================================================

      - name: Resolve configuration
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/config.sh


      # ========================================================
      # Runner cleanup
      # ========================================================

      - name: Free disk space
        if: env.REMOVE_UNUSED_PACKAGES == 'true'
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false


      # ========================================================
      # Swap
      # ========================================================

      - name: Add swap
        shell: bash
        run: |
          set -euo pipefail

          sudo fallocate -l 8G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile

          echo
          echo "===== Memory ====="
          free -h


      # ========================================================
      # Dependencies
      # ========================================================

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update -qq

          sudo apt-get install -y --no-install-recommends \
            bc \
            bison \
            build-essential \
            ccache \
            cpio \
            curl \
            device-tree-compiler \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            libncurses-dev \
            lz4 \
            make \
            python3 \
            rsync \
            unzip \
            zip \
            zstd \
            binutils-aarch64-linux-gnu

          mkdir -p "$WORKSPACE"


      # ========================================================
      # Toolchain
      # ========================================================

      - name: Set up toolchain
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/toolchain.sh


      # ========================================================
      # OPPO MTK toolchain compatibility
      #
      # OPPO 4.19 uses CROSS_COMPILE_COMPAT for vdso32.
      # KernelSU_Action normally exports CROSS_COMPILE_ARM32.
      #
      # Convert downloaded GCC32 path to OPPO's variable.
      # ========================================================

      - name: Configure OPPO MTK toolchain
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo " OPPO MT6877 Toolchain Compatibility"
          echo "=============================================="

          ARM32_PREFIX="$WORKSPACE/gcc-32/bin/arm-linux-androideabi-"

          if [ ! -x "${ARM32_PREFIX}gcc" ]; then
            echo "::error::ARM32 GCC not found:"
            echo "::error::${ARM32_PREFIX}gcc"
            exit 1
          fi

          echo
          echo "ARM32 compiler:"
          "${ARM32_PREFIX}gcc" --version | head -n 1

          echo
          echo "AArch64 binutils:"
          command -v aarch64-linux-gnu-ld || true

          # Override CUSTOM_CMDS exported by config.sh.
          #
          # The absolute path is important because the downloaded GCC32
          # directory is not otherwise guaranteed to expose the prefix
          # expected by OPPO's vdso32 build.
          echo \
            "CUSTOM_CMDS=CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=${ARM32_PREFIX}" \
            >> "$GITHUB_ENV"


      # ========================================================
      # OPPO kernel source
      # ========================================================

      - name: Fetch OPPO kernel source
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/source.sh


      # ========================================================
      # OPPO external modules
      # ========================================================

      - name: Checkout OPPO MT6877 kernel modules
        uses: actions/checkout@v4
        with:
          repository: oppo-source/android_kernel_modules_oppo_mt6877
          ref: oppo/mt6877_t_13.1.0_reno7_se_5g
          path: kernel_workspace/oppo-kernel-modules
          fetch-depth: 1


      # ========================================================
      # Reconstruct OPPO original vendor layout
      #
      # OPPO's released kernel contains multiple styles of
      # relative links.
      #
      # Example:
      #
      # kernel/sched_assist
      #   -> ../../vendor/oplus/...
      #
      # resolves to:
      #
      # kernel_workspace/vendor
      #
      # But:
      #
      # drivers/base/kernelFwUpdate
      #   -> ../../../../vnd/vendor/oplus/...
      #
      # resolves to:
      #
      # $GITHUB_WORKSPACE/vnd/vendor
      #
      # We therefore expose the SAME vendor repository at both
      # expected locations.
      # ========================================================

      - name: Install OPPO MT6877 vendor sources
        shell: bash
        run: |
          set -euo pipefail

          MODULES_DIR="$WORKSPACE/oppo-kernel-modules"

          WORKSPACE_VENDOR="$WORKSPACE/vendor"

          VND_ROOT="$GITHUB_WORKSPACE/vnd"
          VND_VENDOR="$VND_ROOT/vendor"

          echo "=============================================="
          echo " OPPO Reno7 SE 5G / MT6877 Vendor Integration"
          echo "=============================================="

          echo
          echo "GitHub workspace:"
          echo "  $GITHUB_WORKSPACE"

          echo
          echo "Kernel workspace:"
          echo "  $WORKSPACE"

          echo
          echo "Kernel directory:"
          echo "  $KERNEL_DIR"

          echo
          echo "Modules directory:"
          echo "  $MODULES_DIR"


          # ----------------------------------------------------
          # Verify modules repository
          # ----------------------------------------------------

          if [ ! -d "$MODULES_DIR/vendor" ]; then

            echo "::error::OPPO modules repository does not contain vendor/"
            echo "::error::$MODULES_DIR/vendor"

            echo
            echo "Repository layout:"

            find "$MODULES_DIR" \
              -maxdepth 2 \
              -type d \
              2>/dev/null | head -80 || true

            exit 1
          fi


          echo
          echo "Vendor source size:"

          du -sh "$MODULES_DIR/vendor"


          # ----------------------------------------------------
          # Clean incorrect/stale mappings
          # ----------------------------------------------------

          echo
          echo "Cleaning stale vendor mappings..."

          rm -rf "$KERNEL_DIR/vendor"

          rm -rf "$WORKSPACE_VENDOR"

          mkdir -p "$VND_ROOT"

          rm -rf "$VND_VENDOR"


          # ----------------------------------------------------
          # Layout #1
          #
          # kernel_workspace/vendor
          # ----------------------------------------------------

          echo
          echo "Creating:"
          echo "  $WORKSPACE_VENDOR"

          ln -s \
            "$MODULES_DIR/vendor" \
            "$WORKSPACE_VENDOR"


          # ----------------------------------------------------
          # Layout #2
          #
          # <repo>/vnd/vendor
          # ----------------------------------------------------

          echo
          echo "Creating:"
          echo "  $VND_VENDOR"

          ln -s \
            "$MODULES_DIR/vendor" \
            "$VND_VENDOR"


          # ----------------------------------------------------
          # Verify mappings
          # ----------------------------------------------------

          echo
          echo "=============================================="
          echo " Vendor mappings"
          echo "=============================================="

          echo
          echo "[1] kernel_workspace/vendor"

          ls -la "$WORKSPACE_VENDOR"

          echo
          echo "Resolved:"

          realpath "$WORKSPACE_VENDOR"


          echo
          echo "[2] vnd/vendor"

          ls -la "$VND_VENDOR"

          echo
          echo "Resolved:"

          realpath "$VND_VENDOR"


          # ----------------------------------------------------
          # Critical OPPO components
          # ----------------------------------------------------

          echo
          echo "=============================================="
          echo " Checking required OPPO components"
          echo "=============================================="

          required_files=(
            "kernel/sched_assist/Kconfig"
            "kernel/locking/klockopt/Kconfig"
            "drivers/base/kernelFwUpdate/Kconfig"
          )

          for file in "${required_files[@]}"; do

            echo
            echo "Checking:"
            echo "  $file"

            if [ ! -f "$KERNEL_DIR/$file" ]; then

              echo "::error::Missing required OPPO component:"
              echo "::error::$file"

              echo
              echo "Object:"

              ls -la \
                "$KERNEL_DIR/$file" \
                2>/dev/null || true

              echo
              echo "Parent directory:"

              ls -la \
                "$KERNEL_DIR/$(dirname "$file")" \
                2>/dev/null || true

              exit 1
            fi

            echo "OK:"
            realpath "$KERNEL_DIR/$file"

          done


          # ----------------------------------------------------
          # Verify actual kernelFwUpdate source
          # ----------------------------------------------------

          echo
          echo "=============================================="
          echo " kernelFwUpdate source"
          echo "=============================================="

          FW_DIR="$MODULES_DIR/vendor/oplus/kernel/touchpanel/kernelFwUpdate"

          test -f "$FW_DIR/Kconfig"
          test -f "$FW_DIR/Makefile"
          test -f "$FW_DIR/kernelFwUpdate.c"
          test -f "$FW_DIR/kernelFwUpdate.h"

          ls -la "$FW_DIR"


          # ----------------------------------------------------
          # Optional OPPO paths
          # ----------------------------------------------------

          echo
          echo "=============================================="
          echo " Additional OPPO paths"
          echo "=============================================="

          optional_paths=(
            "kernel/uifirst"
            "kernel/prefer_silver"
            "include/linux/sched_assist"
            "include/linux/uifirst"
            "include/linux/iomonitor"
            "include/linux/healthinfo"
            "drivers/soc/oplus"
            "mm/task_mem"
            "mm/malloc_track"
            "mm/oppo_healthinfo"
          )

          for path in "${optional_paths[@]}"; do

            if [ -e "$KERNEL_DIR/$path" ]; then

              echo
              echo "OK: $path"
              realpath "$KERNEL_DIR/$path" 2>/dev/null || true

            else

              echo "::warning::Unavailable OPPO path: $path"

            fi

          done


          # ----------------------------------------------------
          # Broken symlink diagnostics
          # ----------------------------------------------------

          echo
          echo "=============================================="
          echo " Broken symlink scan"
          echo "=============================================="

          mapfile -t BROKEN_LINKS < <(
            find "$KERNEL_DIR" \
              -xtype l \
              -print \
              2>/dev/null || true
          )

          BROKEN_COUNT="${#BROKEN_LINKS[@]}"

          echo
          echo "Broken symlink count:"
          echo "  $BROKEN_COUNT"

          if [ "$BROKEN_COUNT" -gt 0 ]; then

            echo
            echo "First broken links:"

            LIMIT=100
            INDEX=0

            for link in "${BROKEN_LINKS[@]}"; do

              echo
              echo "${link#$KERNEL_DIR/}"

              ls -la "$link" || true

              INDEX=$((INDEX + 1))

              if [ "$INDEX" -ge "$LIMIT" ]; then
                break
              fi

            done

          fi


          # ----------------------------------------------------
          # Main path diagnostics
          # ----------------------------------------------------

          echo
          echo "=============================================="
          echo " sched_assist"
          echo "=============================================="

          ls -la "$KERNEL_DIR/kernel/sched_assist"

          echo
          echo "Resolved:"
          realpath "$KERNEL_DIR/kernel/sched_assist"

          echo
          echo "Kconfig:"
          realpath "$KERNEL_DIR/kernel/sched_assist/Kconfig"


          echo
          echo "=============================================="
          echo " klockopt"
          echo "=============================================="

          ls -la "$KERNEL_DIR/kernel/locking/klockopt"

          echo
          echo "Resolved:"
          realpath "$KERNEL_DIR/kernel/locking/klockopt"

          echo
          echo "Kconfig:"
          realpath "$KERNEL_DIR/kernel/locking/klockopt/Kconfig"


          echo
          echo "=============================================="
          echo " kernelFwUpdate"
          echo "=============================================="

          ls -la "$KERNEL_DIR/drivers/base/kernelFwUpdate"

          echo
          echo "Resolved:"
          realpath "$KERNEL_DIR/drivers/base/kernelFwUpdate"

          echo
          echo "Kconfig:"
          realpath "$KERNEL_DIR/drivers/base/kernelFwUpdate/Kconfig"


          echo
          echo "=============================================="
          echo " OPPO vendor integration successful"
          echo "=============================================="


      # ========================================================
      # SukiSU-Ultra
      # ========================================================

      - name: Install SukiSU-Ultra
        if: env.KSU_VARIANT != 'none'
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/kernelsu.sh


      # ========================================================
      # Patches
      #
      # Current Reno7 SE config:
      #
      # path_umount = enabled
      # manual hook = enabled
      # SUSFS       = disabled
      # KPM         = disabled
      #
      # ========================================================

      - name: Apply kernel patches
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/patches.sh all


      # ========================================================
      # ccache
      # ========================================================

      - name: Set up ccache
        if: env.ENABLE_CCACHE == 'true'
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: >-
            reno7se-mt6877-${{
            env.KERNEL_VERSION }}-${{
            env.KSU_VARIANT }}-${{
            env.KSU_HOOK_MODE }}
          max-size: 2G


      # ========================================================
      # Build
      # ========================================================

      - name: Build kernel
        shell: bash
        run: |
          set -euo pipefail

          LOG="$WORKSPACE/build.log"

          echo "=============================================="
          echo " Building OPPO Reno7 SE 5G kernel"
          echo "=============================================="

          echo
          echo "Build log:"
          echo "  $LOG"

          set +e

          bash scripts/build.sh all \
            2>&1 | tee "$LOG"

          STATUS=${PIPESTATUS[0]}

          set -e

          if [ "$STATUS" -ne 0 ]; then

            echo
            echo "::error::Kernel build failed with status $STATUS"

            echo
            echo "=============================================="
            echo " Last 200 build log lines"
            echo "=============================================="

            tail -n 200 "$LOG" || true

            exit "$STATUS"
          fi


      # ========================================================
      # Package
      # ========================================================

      - name: Package artifacts
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/package.sh all


      # ========================================================
      # Metadata
      # ========================================================

      - name: Export build metadata
        id: meta
        shell: bash
        run: |
          {
            echo "device=${DEVICE}"
            echo "build_time=${BUILD_TIME}"
            echo "ksu_name=${KSU_NAME:-none}"
            echo "ksu_version=${KSU_VERSION_LABEL:-}"
            echo "kernel_release=${KERNEL_RELEASE:-}"
            echo "susfs_version=${SUSFS_VERSION:-disabled}"
          } >> "$GITHUB_OUTPUT"


      # ========================================================
      # Upload raw kernel
      # ========================================================

      - name: Upload kernel image
        uses: actions/upload-artifact@v4
        with:
          name: >-
            Reno7SE-MT6877-${{
            env.KERNEL_IMAGE_NAME }}-${{
            env.BUILD_TIME }}

          path: >-
            kernel_workspace/android-kernel/out/arch/${{
            env.ARCH }}/boot/${{
            env.KERNEL_IMAGE_NAME }}

          if-no-files-found: error


      # ========================================================
      # Upload AnyKernel3
      # ========================================================

      - name: Upload AnyKernel3
        uses: actions/upload-artifact@v4
        with:
          name: >-
            AnyKernel3-Reno7SE-MT6877-${{
            env.KSU_VARIANT }}-${{
            env.BUILD_TIME }}

          path: kernel_workspace/AnyKernel3/*

          if-no-files-found: error


      # ========================================================
      # DTBO
      # ========================================================

      - name: Upload DTBO
        if: env.CHECK_DTBO_IS_OK == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: >-
            dtbo-Reno7SE-MT6877-${{
            env.BUILD_TIME }}

          path: >-
            kernel_workspace/android-kernel/out/arch/${{
            env.ARCH }}/boot/dtbo.img

          if-no-files-found: error


      # ========================================================
      # boot.img
      # ========================================================

      - name: Upload boot image
        if: env.MAKE_BOOT_IMAGE_IS_OK == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: >-
            boot-Reno7SE-MT6877-${{
            env.BUILD_TIME }}

          path: kernel_workspace/boot.img

          if-no-files-found: error


      # ========================================================
      # Failure diagnostics
      # ========================================================

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: >-
            Reno7SE-MT6877-error-${{
            github.run_number }}

          if-no-files-found: ignore

          path: |
            kernel_workspace/build.log
            kernel_workspace/android-kernel/out/.config
            kernel_workspace/android-kernel/out/include/generated/autoconf.h
            kernel_workspace/android-kernel/arch/arm64/configs/k6877v1_64_k419_defconfig


  # ============================================================
  # Optional Release
  # ============================================================

  release:
    name: Publish kernel release

    needs:
      - build

    if: inputs.publish_release

    runs-on: ubuntu-22.04

    permissions:
      contents: write

    steps:

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false


      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release

          shopt -s nullglob


          # ----------------------------------------------------
          # Pack AnyKernel3
          # ----------------------------------------------------

          for dir in artifacts/AnyKernel3*/; do

            name=$(basename "${dir%/}")

            echo "Packing:"
            echo "  $name"

            (
              cd "$dir"

              zip \
                -qr9 \
                "${GITHUB_WORKSPACE}/release/${name}.zip" \
                .
            )

          done


          # ----------------------------------------------------
          # Copy images
          # ----------------------------------------------------

          for file in \
            artifacts/*/Image \
            artifacts/*/Image.gz \
            artifacts/*/Image.gz-dtb \
            artifacts/*/boot.img \
            artifacts/*/dtbo.img
          do

            if [ -f "$file" ]; then
              cp "$file" release/
            fi

          done


          echo
          echo "=============================================="
          echo " Release files"
          echo "=============================================="

          ls -lah release/


      - name: Create GitHub Release
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8
        with:
          tag_name: >-
            Reno7SE-MT6877-${{
            needs.build.outputs.build_time }}

          name: >-
            OPPO Reno7 SE 5G
            ·
            ${{ needs.build.outputs.ksu_name }}
            ·
            ${{ needs.build.outputs.build_time }}

          body: |
            ## OPPO Reno7 SE 5G Custom Kernel

            | Item | Value |
            | --- | --- |
            | Device | OPPO Reno7 SE 5G |
            | SoC | MediaTek MT6877 |
            | Kernel | `${{ needs.build.outputs.kernel_release }}` |
            | Root | `${{ needs.build.outputs.ksu_name }}` |
            | Root Version | `${{ needs.build.outputs.ksu_version }}` |
            | SUSFS | `${{ needs.build.outputs.susfs_version || 'disabled' }}` |

            ### Source

            Kernel:

            `oppo-source/android_kernel_oppo_mt6877`

            Vendor:

            `oppo-source/android_kernel_modules_oppo_mt6877`

            Branch:

            `oppo/mt6877_t_13.1.0_reno7_se_5g`

            ### Current configuration

            - Linux 4.19
            - ARM64
            - SukiSU-Ultra builtin
            - Manual hook
            - path_umount backport
            - SUSFS disabled
            - KPM disabled
            - Non-GKI

            ### Warning

            This is an experimental custom kernel.

            Keep the original stock boot image before flashing.

          files: release/*
