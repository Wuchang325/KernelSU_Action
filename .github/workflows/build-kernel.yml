name: Build OPPO Reno7 SE Kernel

on:
  workflow_dispatch:
    inputs:
      config:
        description: "Config file to build"
        required: false
        default: "config/reno7se-mt6877.env"
        type: string

      ksu_variant:
        description: "KernelSU variant"
        required: false
        default: "config"
        type: choice
        options:
          - config
          - none
          - kernelsu
          - kernelsu-next
          - sukisu-ultra
          - resukisu
          - rsuntk
          - backslashxx

      ksu_ref:
        description: "KernelSU branch/tag/commit"
        required: false
        default: ""
        type: string

      hook_mode:
        description: "KernelSU hook mode"
        required: false
        default: "config"
        type: choice
        options:
          - config
          - auto
          - kprobes
          - manual
          - tracepoint
          - syscall
          - none

      susfs:
        description: "Enable SUSFS"
        required: false
        default: "config"
        type: choice
        options:
          - config
          - "true"
          - "false"

      path_umount:
        description: "Enable path_umount backport"
        required: false
        default: "config"
        type: choice
        options:
          - config
          - "true"
          - "false"

      hide_stuff:
        description: "Enable hide_stuff"
        required: false
        default: "config"
        type: choice
        options:
          - config
          - "true"
          - "false"

      kpm:
        description: "Enable KPM"
        required: false
        default: "config"
        type: choice
        options:
          - config
          - "true"
          - "false"

      extra_defconfig:
        description: "Extra defconfig options"
        required: false
        default: ""
        type: string

      publish_release:
        description: "Publish GitHub Release"
        required: false
        default: false
        type: boolean

  workflow_call:
    inputs:
      config:
        required: false
        default: "config/reno7se-mt6877.env"
        type: string

      ksu_variant:
        required: false
        default: "config"
        type: string

      ksu_ref:
        required: false
        default: ""
        type: string

      hook_mode:
        required: false
        default: "config"
        type: string

      susfs:
        required: false
        default: "config"
        type: string

      path_umount:
        required: false
        default: "config"
        type: string

      hide_stuff:
        required: false
        default: "config"
        type: string

      kpm:
        required: false
        default: "config"
        type: string

      extra_defconfig:
        required: false
        default: ""
        type: string

      publish_release:
        required: false
        default: false
        type: boolean


concurrency:
  group: reno7se-mt6877-${{ github.ref }}-${{ inputs.config }}
  cancel-in-progress: true


permissions:
  contents: read


jobs:
  build:
    name: Build Reno7 SE MT6877 4.19.191

    runs-on: ubuntu-22.04

    timeout-minutes: 120

    outputs:
      device: ${{ steps.meta.outputs.device }}
      build_time: ${{ steps.meta.outputs.build_time }}
      ksu_name: ${{ steps.meta.outputs.ksu_name }}
      ksu_version: ${{ steps.meta.outputs.ksu_version }}
      kernel_release: ${{ steps.meta.outputs.kernel_release }}
      susfs_version: ${{ steps.meta.outputs.susfs_version }}

    env:
      WORKSPACE: ${{ github.workspace }}/kernel_workspace

      CONFIG_ENV: ${{ inputs.config }}

      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

      IN_KSU_VARIANT: ${{ inputs.ksu_variant }}
      IN_KSU_REF: ${{ inputs.ksu_ref }}
      IN_KSU_HOOK_MODE: ${{ inputs.hook_mode }}
      IN_ENABLE_SUSFS: ${{ inputs.susfs }}
      IN_ENABLE_PATH_UMOUNT: ${{ inputs.path_umount }}
      IN_ENABLE_HIDE_STUFF: ${{ inputs.hide_stuff }}
      IN_ENABLE_KPM: ${{ inputs.kpm }}
      IN_EXTRA_DEFCONFIG: ${{ inputs.extra_defconfig }}

    steps:

      # ========================================================
      # KernelSU_Action
      # ========================================================

      - name: Checkout KernelSU Action
        uses: actions/checkout@v4
        with:
          fetch-depth: 1


      # ========================================================
      # Configuration
      #
      # IMPORTANT:
      #
      # config.sh writes resolved values into $GITHUB_ENV.
      #
      # Variables written to $GITHUB_ENV are NOT available to
      # the current step, only later steps.
      #
      # Therefore do not access DEVICE / KSU_VARIANT etc here.
      # ========================================================

      - name: Resolve configuration
        shell: bash
        run: |
          set -euo pipefail

          bash scripts/config.sh


      # ========================================================
      # Show resolved configuration
      #
      # Must be a separate step.
      # ========================================================

      - name: Show resolved configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo " Resolved build configuration"
          echo "=============================================="

          echo
          echo "DEVICE:"
          echo "  ${DEVICE}"

          echo
          echo "ARCH:"
          echo "  ${ARCH}"

          echo
          echo "KERNEL_SOURCE:"
          echo "  ${KERNEL_SOURCE}"

          echo
          echo "KERNEL_SOURCE_BRANCH:"
          echo "  ${KERNEL_SOURCE_BRANCH}"

          echo
          echo "KERNEL_CONFIG:"
          echo "  ${KERNEL_CONFIG}"

          echo
          echo "KERNEL_IMAGE_NAME:"
          echo "  ${KERNEL_IMAGE_NAME}"

          echo
          echo "CLANG:"
          echo "  ${CLANG_BRANCH}/${CLANG_VERSION}"

          echo
          echo "USE_LLVM:"
          echo "  ${USE_LLVM}"

          echo
          echo "ENABLE_GCC_ARM64:"
          echo "  ${ENABLE_GCC_ARM64}"

          echo
          echo "ENABLE_GCC_ARM32:"
          echo "  ${ENABLE_GCC_ARM32}"

          echo
          echo "KSU_VARIANT:"
          echo "  ${KSU_VARIANT}"

          echo
          echo "KSU_REF:"
          echo "  ${KSU_REF:-<default>}"

          echo
          echo "KSU_HOOK_MODE:"
          echo "  ${KSU_HOOK_MODE}"

          echo
          echo "ENABLE_SUSFS:"
          echo "  ${ENABLE_SUSFS}"

          echo
          echo "ENABLE_PATH_UMOUNT:"
          echo "  ${ENABLE_PATH_UMOUNT}"

          echo
          echo "ENABLE_HIDE_STUFF:"
          echo "  ${ENABLE_HIDE_STUFF}"

          echo
          echo "ENABLE_KPM:"
          echo "  ${ENABLE_KPM}"

          echo
          echo "CUSTOM_CMDS:"
          echo "  ${CUSTOM_CMDS:-<none>}"

          echo
          echo "EXTRA_CMDS:"
          echo "  ${EXTRA_CMDS:-<none>}"

          echo
          echo "EXTRA_DEFCONFIG:"
          echo "  ${EXTRA_DEFCONFIG:-<none>}"

          echo
          echo "BUILD_TIME:"
          echo "  ${BUILD_TIME}"

          echo
          echo "=============================================="
          echo " Configuration ready"
          echo "=============================================="


      # ========================================================
      # Disk cleanup
      #
      # Always run on the GitHub-hosted runner.
      # ========================================================

      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false


      # ========================================================
      # Swap
      # ========================================================

      - name: Add swap space
        shell: bash
        run: |
          set -euo pipefail

          sudo fallocate -l 8G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile

          echo
          echo "=============================================="
          echo " Memory"
          echo "=============================================="

          free -h


      # ========================================================
      # Dependencies
      # ========================================================

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update -qq

          sudo apt-get install \
            -y \
            --no-install-recommends \
            bc \
            bison \
            build-essential \
            ccache \
            cpio \
            curl \
            device-tree-compiler \
            file \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            libncurses-dev \
            lz4 \
            make \
            python3 \
            rsync \
            unzip \
            zip \
            zstd \
            binutils-aarch64-linux-gnu \
            binutils-arm-linux-gnueabi

          mkdir -p "$WORKSPACE"


      # ========================================================
      # Toolchain
      # ========================================================

      - name: Set up toolchain
        shell: bash
        run: |
          set -euo pipefail

          bash scripts/toolchain.sh


      # ========================================================
      # LLVM verification
      #
      # Reno7 SE MT6877 vdso32 uses Clang.
      #
      # No ARM32 GCC compiler is required.
      # ========================================================

      - name: Verify MT6877 LLVM toolchain
        shell: bash
        run: |
          set -euo pipefail

          export PATH="$CLANG_PATH:$PATH"

          echo "=============================================="
          echo " MT6877 LLVM Toolchain"
          echo "=============================================="

          echo
          echo "Clang:"
          clang --version | head -n 2

          echo
          echo "LLD:"
          ld.lld --version | head -n 1

          echo
          echo "llvm-ar:"
          llvm-ar --version | head -n 1

          echo
          echo "llvm-nm:"
          llvm-nm --version | head -n 1

          echo
          echo "llvm-objcopy:"
          llvm-objcopy --version | head -n 1

          echo
          echo "llvm-objdump:"
          llvm-objdump --version | head -n 1

          echo
          echo "AArch64 GNU elfedit:"
          command -v aarch64-linux-gnu-elfedit

          echo
          echo "ARM32 Clang compatibility target:"

          printf 'int x;\n' \
            | clang \
                --target=arm-linux-gnueabi \
                -x c \
                -c - \
                -o /tmp/arm32-test.o

          file /tmp/arm32-test.o

          rm -f /tmp/arm32-test.o

          echo
          echo "LLVM toolchain verified."


      # ========================================================
      # OPPO kernel source
      # ========================================================

      - name: Fetch OPPO MT6877 kernel source
        shell: bash
        run: |
          set -euo pipefail

          bash scripts/source.sh


      # ========================================================
      # Verify kernel source
      #
      # KERNEL_DIR was exported to GITHUB_ENV by source.sh and
      # is available from this step onward.
      # ========================================================

      - name: Verify Reno7 SE kernel source
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo " OPPO Reno7 SE kernel source"
          echo "=============================================="

          echo
          echo "Kernel directory:"
          echo "  $KERNEL_DIR"

          test -d "$KERNEL_DIR"

          echo
          echo "Kernel version:"

          make \
            -s \
            -C "$KERNEL_DIR" \
            kernelversion

          echo
          echo "Defconfig:"

          DEFCONFIG="$KERNEL_DIR/arch/arm64/configs/$KERNEL_CONFIG"

          test -f "$DEFCONFIG"

          echo "  $DEFCONFIG"

          echo
          echo "Kernel Git revision:"

          git \
            -C "$KERNEL_DIR" \
            rev-parse HEAD


      # ========================================================
      # OPPO MT6877 vendor/modules source
      # ========================================================

      - name: Checkout OPPO MT6877 kernel modules
        uses: actions/checkout@v4
        with:
          repository: oppo-source/android_kernel_modules_oppo_mt6877
          ref: oppo/mt6877_t_13.1.0_reno7_se_5g
          path: kernel_workspace/oppo-kernel-modules
          fetch-depth: 1


      # ========================================================
      # OPPO vendor source layout
      #
      # Main kernel contains relative links which expect:
      #
      #   kernel_workspace/vendor
      #
      # and:
      #
      #   $GITHUB_WORKSPACE/vnd/vendor
      #
      # Both point to the official modules repository vendor/.
      # ========================================================

      - name: Install OPPO MT6877 vendor mappings
        shell: bash
        run: |
          set -euo pipefail

          MODULES_DIR="$WORKSPACE/oppo-kernel-modules"

          WORKSPACE_VENDOR="$WORKSPACE/vendor"

          VND_ROOT="$GITHUB_WORKSPACE/vnd"

          VND_VENDOR="$VND_ROOT/vendor"


          echo "=============================================="
          echo " OPPO MT6877 Vendor Integration"
          echo "=============================================="

          echo
          echo "GitHub workspace:"
          echo "  $GITHUB_WORKSPACE"

          echo
          echo "Kernel workspace:"
          echo "  $WORKSPACE"

          echo
          echo "Kernel:"
          echo "  $KERNEL_DIR"

          echo
          echo "Modules:"
          echo "  $MODULES_DIR"


          # ----------------------------------------------------
          # Verify official vendor source
          # ----------------------------------------------------

          if [ ! -d "$MODULES_DIR/vendor" ]; then

            echo "::error::OPPO modules repository does not contain:"
            echo "::error::$MODULES_DIR/vendor"

            exit 1

          fi


          echo
          echo "Vendor source size:"

          du -sh "$MODULES_DIR/vendor"


          # ----------------------------------------------------
          # Remove stale/incorrect mappings
          # ----------------------------------------------------

          rm -rf "$KERNEL_DIR/vendor"

          rm -rf "$WORKSPACE_VENDOR"

          mkdir -p "$VND_ROOT"

          rm -rf "$VND_VENDOR"


          # ----------------------------------------------------
          # Mapping #1:
          #
          # kernel_workspace/vendor
          # ----------------------------------------------------

          ln -s \
            "$MODULES_DIR/vendor" \
            "$WORKSPACE_VENDOR"


          # ----------------------------------------------------
          # Mapping #2:
          #
          # repository-root/vnd/vendor
          # ----------------------------------------------------

          ln -s \
            "$MODULES_DIR/vendor" \
            "$VND_VENDOR"


          echo
          echo "=============================================="
          echo " kernel_workspace/vendor"
          echo "=============================================="

          ls -la "$WORKSPACE_VENDOR"

          echo
          echo "Resolved:"
          realpath "$WORKSPACE_VENDOR"


          echo
          echo "=============================================="
          echo " repository-root/vnd/vendor"
          echo "=============================================="

          ls -la "$VND_VENDOR"

          echo
          echo "Resolved:"
          realpath "$VND_VENDOR"


          # ----------------------------------------------------
          # Required OPPO components already discovered
          # ----------------------------------------------------

          required_files=(
            "kernel/sched_assist/Kconfig"
            "kernel/locking/klockopt/Kconfig"
            "drivers/base/kernelFwUpdate/Kconfig"
          )


          echo
          echo "=============================================="
          echo " Required OPPO components"
          echo "=============================================="

          for file in "${required_files[@]}"; do

            echo
            echo "Checking:"
            echo "  $file"

            if [ ! -f "$KERNEL_DIR/$file" ]; then

              echo "::error::Missing OPPO source:"
              echo "::error::$file"

              echo
              echo "Parent directory:"

              ls -la \
                "$KERNEL_DIR/$(dirname "$file")" \
                || true

              exit 1

            fi


            echo "OK:"
            realpath "$KERNEL_DIR/$file"

          done


          # ----------------------------------------------------
          # Broken links are diagnostic only.
          #
          # Do not fail merely because optional hardware
          # configurations contain unresolved symlinks.
          # ----------------------------------------------------

          echo
          echo "=============================================="
          echo " Broken symlink scan"
          echo "=============================================="

          find "$KERNEL_DIR" \
            -xtype l \
            -print \
            2>/dev/null \
            | tee "$WORKSPACE/broken-symlinks.txt" \
            || true

          echo
          echo "Broken symlink count:"

          wc -l "$WORKSPACE/broken-symlinks.txt" || true


          echo
          echo "=============================================="
          echo " OPPO vendor integration ready"
          echo "=============================================="


      # ========================================================
      # OPPO / MediaTek Werror compatibility
      #
      # CONFIG_CC_WERROR=n cannot override vendor Makefiles that
      # explicitly contain:
      #
      #   ccflags-y += -Werror
      #   subdir-ccflags-y += -Werror
      #
      # This converts only standalone -Werror to -Wno-error.
      #
      # It deliberately preserves:
      #
      #   -Werror=something
      #
      # because those often indicate real API problems.
      # ========================================================

      - name: Disable OPPO and MediaTek vendor Werror
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo " OPPO / MTK Vendor Werror Compatibility"
          echo "=============================================="

          python3 - "$KERNEL_DIR" <<'PY'
          from pathlib import Path
          import re
          import sys

          root = Path(sys.argv[1])

          if not root.is_dir():
              raise SystemExit(
                  f"Kernel directory does not exist: {root}"
              )

          # Match standalone -Werror only.
          #
          # Examples changed:
          #
          #   ccflags-y += -Werror
          #   subdir-ccflags-y += -Werror -I...
          #
          # Examples preserved:
          #
          #   -Werror=strict-prototypes
          #   -Werror=implicit-function-declaration

          pattern = re.compile(
              r'(?<!\S)-Werror(?=\s|$)'
          )

          changed_files = []
          changed_flags = 0

          for path in root.rglob("*"):

              if not path.is_file():
                  continue

              if path.name not in (
                  "Makefile",
                  "Kbuild",
              ):
                  continue

              try:
                  text = path.read_text()

              except UnicodeDecodeError:
                  continue

              updated, count = pattern.subn(
                  "-Wno-error",
                  text
              )

              if not count:
                  continue

              path.write_text(updated)

              changed_files.append(
                  (
                      path.relative_to(root),
                      count,
                  )
              )

              changed_flags += count


          print()
          print(
              f"Changed {changed_flags} standalone "
              f"-Werror flags in {len(changed_files)} files."
          )
          print()

          for path, count in changed_files:
              print(
                  f"[{count:2}] {path}"
              )

          print()
          print(
              "Specific -Werror=<diagnostic> flags were preserved."
          )
          PY


          echo
          echo "=============================================="
          echo " Remaining standalone -Werror"
          echo "=============================================="

          grep \
            -R \
            --include='Makefile' \
            --include='Kbuild' \
            -nE \
            '(^|[[:space:]])-Werror([[:space:]]|$)' \
            "$KERNEL_DIR" \
            || true


          echo
          echo "=============================================="
          echo " Vendor Werror compatibility ready"
          echo "=============================================="


      # ========================================================
      # Install ReSukiSU
      # ========================================================

      - name: Install KernelSU variant
        shell: bash
        run: |
          set -euo pipefail

          if [ "${KSU_VARIANT}" = "none" ]; then

            echo "KernelSU disabled."
            exit 0

          fi

          bash scripts/kernelsu.sh


      # ========================================================
      # ReSukiSU information
      # ========================================================

      - name: Show ReSukiSU information
        shell: bash
        run: |
          set -euo pipefail

          if [ "${KSU_VARIANT}" != "resukisu" ]; then
            echo "Not a ReSukiSU build; skipping."
            exit 0
          fi

          echo "=============================================="
          echo " ReSukiSU"
          echo "=============================================="

          echo "KSU_NAME=${KSU_NAME:-}"
          echo "KSU_REF_RESOLVED=${KSU_REF_RESOLVED:-}"
          echo "KSU_VERSION_LABEL=${KSU_VERSION_LABEL:-}"
          echo "KSU_COMMIT_COUNT=${KSU_COMMIT_COUNT:-}"
          echo "KSU_HOOK_MODE_RESOLVED=${KSU_HOOK_MODE_RESOLVED:-}"

          echo
          echo "KernelSU source:"

          test -d "$KERNEL_DIR/KernelSU"

          git \
            -C "$KERNEL_DIR/KernelSU" \
            log \
            -1 \
            --oneline


      # ========================================================
      # OPPO MT6877 ReSukiSU manual hooks
      #
      # Required file in this repository:
      #
      # scripts/apply_oppo_mt6877_resukisu_hooks.sh
      #
      # No custom .patch file is required anymore.
      # ========================================================

      - name: Apply Reno7 SE ReSukiSU 4.19 hooks
        shell: bash
        run: |
          set -euo pipefail

          if [ "${KSU_VARIANT}" != "resukisu" ]; then
            echo "Not a ReSukiSU build; skipping."
            exit 0
          fi

          SCRIPT="$GITHUB_WORKSPACE/scripts/apply_oppo_mt6877_resukisu_hooks.sh"

          if [ ! -f "$SCRIPT" ]; then

            echo "::error::Missing OPPO MT6877 ReSukiSU integration script:"
            echo "::error::$SCRIPT"

            exit 1

          fi

          chmod +x "$SCRIPT"

          bash "$SCRIPT"


      # ========================================================
      # Remaining patches
      #
      # Our MT6877 script already installed manual hooks.
      #
      # Prevent scripts/patches.sh from applying the generic hook
      # patch again while still allowing path_umount.
      # ========================================================

      - name: Apply remaining kernel patches
        shell: bash
        run: |
          set -euo pipefail

          if [ "${KSU_VARIANT}" = "resukisu" ]; then

            KSU_HOOK_MODE_RESOLVED=none \
              bash scripts/patches.sh all

          else

            bash scripts/patches.sh all

          fi


      # ========================================================
      # ReSukiSU integration verification
      # ========================================================

      - name: Verify ReSukiSU integration
        shell: bash
        run: |
          set -euo pipefail

          if [ "${KSU_VARIANT}" != "resukisu" ]; then
            echo "Not a ReSukiSU build; skipping."
            exit 0
          fi


          echo "=============================================="
          echo " ReSukiSU Integration Verification"
          echo "=============================================="


          test -d "$KERNEL_DIR/KernelSU"


          grep -q \
            "ksu_handle_execveat" \
            "$KERNEL_DIR/fs/exec.c"


          grep -q \
            "ksu_handle_faccessat" \
            "$KERNEL_DIR/fs/open.c"


          grep -q \
            "ksu_handle_stat" \
            "$KERNEL_DIR/fs/stat.c"


          grep -q \
            "ksu_handle_newfstat_ret" \
            "$KERNEL_DIR/fs/stat.c"


          grep -q \
            "ksu_handle_fstat64_ret" \
            "$KERNEL_DIR/fs/stat.c"


          grep -q \
            "ksu_handle_sys_reboot" \
            "$KERNEL_DIR/kernel/reboot.c"


          if [ "${ENABLE_PATH_UMOUNT}" = "true" ]; then

            grep -q \
              "^int path_umount" \
              "$KERNEL_DIR/fs/namespace.c"

          fi


          echo
          echo "ReSukiSU source:      OK"
          echo "execve hook:          OK"
          echo "faccessat hook:       OK"
          echo "stat hook:            OK"
          echo "newfstat hook:        OK"
          echo "fstat64 hook:         OK"
          echo "reboot hook:          OK"

          if [ "${ENABLE_PATH_UMOUNT}" = "true" ]; then
            echo "path_umount:          OK"
          fi


          echo
          echo "=============================================="
          echo " ReSukiSU source integration complete"
          echo "=============================================="


      # ========================================================
      # Show changes before build
      # ========================================================

      - name: Show kernel source changes
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo " Kernel source changes"
          echo "=============================================="

          cd "$KERNEL_DIR"

          git diff --stat || true

          echo
          echo "Checking introduced whitespace errors:"

          git diff --check


      # ========================================================
      # ccache
      # ========================================================

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: Reno7SE-MT6877-4.19-ReSukiSU-r450784e
          max-size: 2G


      # ========================================================
      # Build
      # ========================================================

      - name: Build kernel
        shell: bash
        run: |
          set -euo pipefail

          LOG="$WORKSPACE/build.log"

          echo "=============================================="
          echo " OPPO Reno7 SE 5G"
          echo " MT6877"
          echo " Linux 4.19.191"
          echo " ReSukiSU"
          echo "=============================================="

          echo
          echo "Build log:"
          echo "  $LOG"


          set +e


          bash scripts/build.sh all \
            2>&1 \
            | tee "$LOG"


          STATUS=${PIPESTATUS[0]}


          set -e


          if [ "$STATUS" -ne 0 ]; then

            echo
            echo "::error::Kernel build failed with status $STATUS"


            echo
            echo "=============================================="
            echo " First real compiler / linker errors"
            echo "=============================================="

            grep \
              -nEi \
              'error:|fatal error:|undefined reference|undefined symbol|No such file or directory|ld\.lld: error:|relocation.*failed|multiple definition' \
              "$LOG" \
              | head -n 120 \
              || true


            echo
            echo "=============================================="
            echo " Make failures"
            echo "=============================================="

            grep \
              -nE \
              'make(\[[0-9]+\])?: \*\*\*' \
              "$LOG" \
              | head -n 120 \
              || true


            echo
            echo "=============================================="
            echo " Last 350 build log lines"
            echo "=============================================="

            tail \
              -n 350 \
              "$LOG" \
              || true


            exit "$STATUS"

          fi


      # ========================================================
      # Verify final kernel config
      # ========================================================

      - name: Verify final kernel config
        shell: bash
        run: |
          set -euo pipefail

          CONFIG="$KERNEL_DIR/out/.config"

          test -f "$CONFIG"


          echo "=============================================="
          echo " Final Kernel Configuration"
          echo "=============================================="


          echo
          echo "KernelSU:"

          grep \
            -E '^CONFIG_KSU(=|_)' \
            "$CONFIG" \
            || true


          echo
          echo "Kallsyms:"

          grep \
            -E '^CONFIG_KALLSYMS' \
            "$CONFIG" \
            || true


          echo
          echo "Module signature:"

          grep \
            -E \
            '^CONFIG_MODULE_SIG|^# CONFIG_MODULE_SIG_FORCE' \
            "$CONFIG" \
            || true


          echo
          echo "OverlayFS:"

          grep \
            -E '^CONFIG_OVERLAY_FS=' \
            "$CONFIG" \
            || true


          echo
          echo "LTO / CFI:"

          grep \
            -E 'CONFIG_(LTO|CFI)' \
            "$CONFIG" \
            || true


          if [ "${KSU_VARIANT}" = "resukisu" ]; then

            grep -q \
              '^CONFIG_KSU=y' \
              "$CONFIG"

            grep -q \
              '^CONFIG_KSU_MANUAL_HOOK=y' \
              "$CONFIG"

            grep -q \
              '^CONFIG_KALLSYMS=y' \
              "$CONFIG"

            grep -q \
              '^CONFIG_KALLSYMS_ALL=y' \
              "$CONFIG"

          fi


          # ----------------------------------------------------
          # Do not allow module signature FORCE to come back.
          # ----------------------------------------------------

          if grep -q \
            '^CONFIG_MODULE_SIG_FORCE=y' \
            "$CONFIG"
          then

            echo "::error::CONFIG_MODULE_SIG_FORCE is still enabled."

            exit 1

          fi


          echo
          echo "Final kernel configuration verified."


      # ========================================================
      # Verify Image.gz
      # ========================================================

      - name: Verify kernel image
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="$KERNEL_DIR/out/arch/arm64/boot/Image.gz"

          echo "=============================================="
          echo " Kernel Image"
          echo "=============================================="

          if [ ! -s "$IMAGE" ]; then

            echo "::error::Image.gz does not exist:"
            echo "::error::$IMAGE"

            echo
            echo "Boot output directory:"

            ls -lah \
              "$KERNEL_DIR/out/arch/arm64/boot" \
              || true

            exit 1

          fi


          echo
          echo "Image:"
          echo "  $IMAGE"


          echo
          echo "Type:"

          file "$IMAGE"


          echo
          echo "Size:"

          ls -lh "$IMAGE"


          echo
          echo "SHA256:"

          sha256sum "$IMAGE"


          echo
          echo "Kernel release:"

          if [ -f "$KERNEL_DIR/out/include/generated/utsrelease.h" ]; then

            cat \
              "$KERNEL_DIR/out/include/generated/utsrelease.h"

          fi


      # ========================================================
      # Package
      # ========================================================

      - name: Package artifacts
        shell: bash
        run: |
          set -euo pipefail

          bash scripts/package.sh all


      # ========================================================
      # Metadata
      # ========================================================

      - name: Export build metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "device=${DEVICE}"
            echo "build_time=${BUILD_TIME}"
            echo "ksu_name=${KSU_NAME:-none}"
            echo "ksu_version=${KSU_VERSION_LABEL:-}"
            echo "kernel_release=${KERNEL_RELEASE:-}"
            echo "susfs_version=${SUSFS_VERSION:-disabled}"
          } >> "$GITHUB_OUTPUT"


      # ========================================================
      # Upload Image.gz
      # ========================================================

      - name: Upload kernel Image.gz
        uses: actions/upload-artifact@v4
        with:
          name: Image.gz-ReSukiSU-Reno7SE-MT6877-${{ github.run_number }}
          path: kernel_workspace/android-kernel/out/arch/arm64/boot/Image.gz
          if-no-files-found: error
          compression-level: 0


      # ========================================================
      # Upload AnyKernel3
      #
      # Diagnostic/additional artifact only for now.
      #
      # First real flash should use stock boot.img repacking.
      # ========================================================

      - name: Upload AnyKernel3
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3-ReSukiSU-Reno7SE-MT6877-${{ github.run_number }}
          path: kernel_workspace/AnyKernel3/*
          if-no-files-found: error


      # ========================================================
      # Optional DTBO
      #
      # Ignore if absent.
      # ========================================================

      - name: Upload DTBO if present
        uses: actions/upload-artifact@v4
        with:
          name: DTBO-Reno7SE-MT6877-${{ github.run_number }}
          path: kernel_workspace/android-kernel/out/arch/arm64/boot/dtbo.img
          if-no-files-found: ignore


      # ========================================================
      # Optional boot.img
      #
      # BUILD_BOOT_IMG is currently false, so this normally does
      # nothing. Kept for the future stock boot integration.
      # ========================================================

      - name: Upload boot image if present
        uses: actions/upload-artifact@v4
        with:
          name: boot-ReSukiSU-Reno7SE-MT6877-${{ github.run_number }}
          path: kernel_workspace/boot.img
          if-no-files-found: ignore


      # ========================================================
      # Build logs even on success
      #
      # Useful while bringing up this kernel.
      # ========================================================

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BuildLog-Reno7SE-MT6877-${{ github.run_number }}
          path: kernel_workspace/build.log
          if-no-files-found: ignore


      # ========================================================
      # Failure diagnostics
      # ========================================================

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Reno7SE-MT6877-error-${{ github.run_number }}
          if-no-files-found: ignore
          path: |
            kernel_workspace/build.log
            kernel_workspace/broken-symlinks.txt
            kernel_workspace/defconfig.orig
            kernel_workspace/android-kernel/out/.config
            kernel_workspace/android-kernel/out/include/generated/autoconf.h
            kernel_workspace/android-kernel/out/include/generated/utsrelease.h
            kernel_workspace/android-kernel/arch/arm64/configs/k6877v1_64_k419_defconfig


  # ============================================================
  # Optional Release
  # ============================================================

  release:
    name: Publish Reno7 SE Kernel Release

    needs:
      - build

    if: inputs.publish_release

    runs-on: ubuntu-22.04

    permissions:
      contents: write

    steps:

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false


      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release

          shopt -s nullglob


          echo "=============================================="
          echo " Packaging AnyKernel3"
          echo "=============================================="

          for dir in artifacts/AnyKernel3*/; do

            name=$(basename "${dir%/}")

            echo
            echo "Packing:"
            echo "  $name"

            (
              cd "$dir"

              zip \
                -qr9 \
                "${GITHUB_WORKSPACE}/release/${name}.zip" \
                .
            )

          done


          echo
          echo "=============================================="
          echo " Copying raw images"
          echo "=============================================="

          for file in \
            artifacts/*/Image \
            artifacts/*/Image.gz \
            artifacts/*/Image.gz-dtb \
            artifacts/*/boot.img \
            artifacts/*/dtbo.img

          do

            if [ -f "$file" ]; then

              cp \
                "$file" \
                release/

            fi

          done


          echo
          echo "=============================================="
          echo " Release files"
          echo "=============================================="

          ls -lah release/


      - name: Create GitHub Release
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8
        with:
          tag_name: Reno7SE-MT6877-${{ needs.build.outputs.build_time }}

          name: >-
            Reno7 SE 5G · ReSukiSU · Linux 4.19.191 ·
            ${{ needs.build.outputs.build_time }}

          body: |
            ## OPPO Reno7 SE 5G Custom Kernel

            | Item | Value |
            | --- | --- |
            | Device | OPPO Reno7 SE 5G |
            | SoC | MediaTek MT6877 |
            | Kernel | `${{ needs.build.outputs.kernel_release }}` |
            | Root | `${{ needs.build.outputs.ksu_name }}` |
            | Root Version | `${{ needs.build.outputs.ksu_version }}` |
            | SUSFS | disabled |

            ### Kernel source

            `oppo-source/android_kernel_oppo_mt6877`

            Branch:

            `oppo/mt6877_t_13.1.0_reno7_se_5g`

            Vendor/modules:

            `oppo-source/android_kernel_modules_oppo_mt6877`

            ### Root integration

            - ReSukiSU
            - Manual syscall hooks
            - OPPO MT6877-specific Linux 4.19 integration
            - path_umount backport

            ### Compatibility changes

            - SUSFS disabled
            - KPM disabled
            - original LOCALVERSION preserved
            - module signature support retained
            - CONFIG_MODULE_SIG_FORCE disabled
            - OPPO/MediaTek standalone -Werror converted to -Wno-error
            - specific -Werror=<diagnostic> checks preserved
            - ARM32 vDSO compiled with Clang target arm-linux-gnueabi

            ### Flashing

            The AnyKernel3 ZIP is currently provided mainly as an
            additional artifact.

            For the first real-device test, use the exact stock boot.img
            from the same installed ColorOS build and replace only the
            kernel with the newly built Image.gz/Image.

            Keep the original stock boot.img before testing.

          files: release/*
