name: Build OPPO Reno7 SE Kernel

on:
  workflow_dispatch:
    inputs:
      config:
        description: "Config file to build"
        required: false
        default: "config/reno7se-mt6877.env"
        type: string

      ksu_variant:
        description: "KernelSU variant"
        required: false
        default: "config"
        type: choice
        options:
          - config
          - none
          - kernelsu
          - kernelsu-next
          - sukisu-ultra
          - resukisu
          - rsuntk
          - backslashxx

      ksu_ref:
        description: "KernelSU branch/tag/commit"
        required: false
        default: ""
        type: string

      hook_mode:
        description: "KernelSU hook mode"
        required: false
        default: "config"
        type: choice
        options:
          - config
          - auto
          - kprobes
          - manual
          - tracepoint
          - syscall
          - none

      susfs:
        description: "Enable SUSFS"
        required: false
        default: "config"
        type: choice
        options:
          - config
          - "true"
          - "false"

      path_umount:
        description: "Enable path_umount backport"
        required: false
        default: "config"
        type: choice
        options:
          - config
          - "true"
          - "false"

      hide_stuff:
        description: "Enable hide_stuff"
        required: false
        default: "config"
        type: choice
        options:
          - config
          - "true"
          - "false"

      kpm:
        description: "Enable KPM"
        required: false
        default: "config"
        type: choice
        options:
          - config
          - "true"
          - "false"

      extra_defconfig:
        description: "Extra defconfig options"
        required: false
        default: ""
        type: string

      publish_release:
        description: "Publish GitHub Release"
        required: false
        default: false
        type: boolean


  workflow_call:
    inputs:
      config:
        required: false
        default: "config/reno7se-mt6877.env"
        type: string

      ksu_variant:
        required: false
        default: "config"
        type: string

      ksu_ref:
        required: false
        default: ""
        type: string

      hook_mode:
        required: false
        default: "config"
        type: string

      susfs:
        required: false
        default: "config"
        type: string

      path_umount:
        required: false
        default: "config"
        type: string

      hide_stuff:
        required: false
        default: "config"
        type: string

      kpm:
        required: false
        default: "config"
        type: string

      extra_defconfig:
        required: false
        default: ""
        type: string

      publish_release:
        required: false
        default: false
        type: boolean


concurrency:
  group: reno7se-${{ github.ref }}-${{ inputs.config }}
  cancel-in-progress: true


permissions:
  contents: read


jobs:

  build:

    name: Build Reno7 SE MT6877 4.19.191

    runs-on: ubuntu-22.04

    timeout-minutes: 120


    outputs:
      device: ${{ steps.meta.outputs.device }}
      build_time: ${{ steps.meta.outputs.build_time }}
      ksu_name: ${{ steps.meta.outputs.ksu_name }}
      ksu_version: ${{ steps.meta.outputs.ksu_version }}
      kernel_release: ${{ steps.meta.outputs.kernel_release }}
      susfs_version: ${{ steps.meta.outputs.susfs_version }}


    env:

      WORKSPACE: ${{ github.workspace }}/kernel_workspace

      CONFIG_ENV: ${{ inputs.config }}


      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"

      CCACHE_NOHASHDIR: "true"

      CCACHE_HARDLINK: "true"


      IN_KSU_VARIANT: ${{ inputs.ksu_variant }}

      IN_KSU_REF: ${{ inputs.ksu_ref }}

      IN_KSU_HOOK_MODE: ${{ inputs.hook_mode }}

      IN_ENABLE_SUSFS: ${{ inputs.susfs }}

      IN_ENABLE_PATH_UMOUNT: ${{ inputs.path_umount }}

      IN_ENABLE_HIDE_STUFF: ${{ inputs.hide_stuff }}

      IN_ENABLE_KPM: ${{ inputs.kpm }}

      IN_EXTRA_DEFCONFIG: ${{ inputs.extra_defconfig }}


    steps:


      # ========================================================
      # KernelSU_Action
      # ========================================================

      - name: Checkout KernelSU Action

        uses: actions/checkout@v4

        with:
          fetch-depth: 1


      # ========================================================
      # Configuration
      # ========================================================

      - name: Resolve configuration

        shell: bash

        run: |
          set -euo pipefail

          bash scripts/config.sh


      # ========================================================
      # Runner cleanup
      # ========================================================

      - name: Free disk space

        if: env.REMOVE_UNUSED_PACKAGES == 'true'

        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be

        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false


      # ========================================================
      # Swap
      # ========================================================

      - name: Add swap space

        shell: bash

        run: |
          set -euo pipefail

          sudo fallocate \
            -l 8G \
            /mnt/swapfile

          sudo chmod \
            600 \
            /mnt/swapfile

          sudo mkswap \
            /mnt/swapfile

          sudo swapon \
            /mnt/swapfile

          echo
          echo "Memory:"

          free -h


      # ========================================================
      # Build dependencies
      # ========================================================

      - name: Install build dependencies

        shell: bash

        run: |
          set -euo pipefail

          sudo apt-get update -qq

          sudo apt-get install \
            -y \
            --no-install-recommends \
            bc \
            bison \
            build-essential \
            ccache \
            cpio \
            curl \
            device-tree-compiler \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            libncurses-dev \
            lz4 \
            make \
            python3 \
            rsync \
            unzip \
            zip \
            zstd \
            binutils-aarch64-linux-gnu \
            binutils-arm-linux-gnueabi

          mkdir -p "$WORKSPACE"


      # ========================================================
      # Toolchain
      # ========================================================

      - name: Set up toolchain

        shell: bash

        run: |
          set -euo pipefail

          bash scripts/toolchain.sh


      # ========================================================
      # LLVM diagnostics
      # ========================================================

      - name: Verify MT6877 LLVM toolchain

        shell: bash

        run: |
          set -euo pipefail


          echo "=============================================="
          echo " MT6877 LLVM Toolchain"
          echo "=============================================="


          export PATH="$CLANG_PATH:$PATH"


          echo
          echo "Clang:"

          clang --version | head -n 2


          echo
          echo "LLD:"

          ld.lld --version | head -n 1


          echo
          echo "LLVM AR:"

          llvm-ar --version | head -n 1


          echo
          echo "LLVM NM:"

          llvm-nm --version | head -n 1


          echo
          echo "AArch64 binutils prefix:"

          command -v \
            aarch64-linux-gnu-elfedit


          echo
          echo "ARM32 clang target test:"

          printf 'int x;\n' \
            | clang \
                --target=arm-linux-gnueabi \
                -x c \
                -c - \
                -o /tmp/arm32-test.o


          file /tmp/arm32-test.o


          rm -f /tmp/arm32-test.o


          echo
          echo "LLVM toolchain verified."


      # ========================================================
      # OPPO kernel source
      # ========================================================

      - name: Fetch OPPO MT6877 kernel source

        shell: bash

        run: |
          set -euo pipefail

          bash scripts/source.sh


      # ========================================================
      # Verify kernel
      # ========================================================

      - name: Verify Reno7 SE kernel source

        shell: bash

        run: |
          set -euo pipefail


          echo "=============================================="
          echo " Kernel Source"
          echo "=============================================="


          echo
          echo "Directory:"
          echo "  $KERNEL_DIR"


          echo
          echo "Version:"

          make \
            -s \
            -C "$KERNEL_DIR" \
            kernelversion


          echo
          echo "Defconfig:"

          test -f \
            "$KERNEL_DIR/arch/arm64/configs/k6877v1_64_k419_defconfig"

          echo \
            "$KERNEL_DIR/arch/arm64/configs/k6877v1_64_k419_defconfig"


      # ========================================================
      # OPPO modules
      # ========================================================

      - name: Checkout OPPO MT6877 kernel modules

        uses: actions/checkout@v4

        with:
          repository: oppo-source/android_kernel_modules_oppo_mt6877

          ref: oppo/mt6877_t_13.1.0_reno7_se_5g

          path: kernel_workspace/oppo-kernel-modules

          fetch-depth: 1


      # ========================================================
      # Reconstruct OPPO source tree
      #
      # Layout #1:
      #
      # kernel/sched_assist
      # -> ../../vendor/...
      #
      # therefore:
      #
      # kernel_workspace/vendor
      #
      #
      # Layout #2:
      #
      # drivers/base/kernelFwUpdate
      # -> ../../../../vnd/vendor/...
      #
      # therefore:
      #
      # repo-root/vnd/vendor
      # ========================================================

      - name: Install OPPO MT6877 vendor mappings

        shell: bash

        run: |
          set -euo pipefail


          MODULES_DIR="$WORKSPACE/oppo-kernel-modules"

          WORKSPACE_VENDOR="$WORKSPACE/vendor"

          VND_ROOT="$GITHUB_WORKSPACE/vnd"

          VND_VENDOR="$VND_ROOT/vendor"


          echo "=============================================="
          echo " OPPO MT6877 Vendor Integration"
          echo "=============================================="


          echo
          echo "GitHub workspace:"
          echo "  $GITHUB_WORKSPACE"


          echo
          echo "Kernel workspace:"
          echo "  $WORKSPACE"


          echo
          echo "Kernel:"
          echo "  $KERNEL_DIR"


          echo
          echo "Modules:"
          echo "  $MODULES_DIR"


          # ----------------------------------------------------
          # Verify modules repository
          # ----------------------------------------------------

          if [ ! -d "$MODULES_DIR/vendor" ]; then

            echo "::error::OPPO modules repository does not contain:"
            echo "::error::$MODULES_DIR/vendor"

            exit 1

          fi


          echo
          echo "Vendor source size:"

          du -sh \
            "$MODULES_DIR/vendor"


          # ----------------------------------------------------
          # Clean stale mappings
          # ----------------------------------------------------

          rm -rf \
            "$KERNEL_DIR/vendor"


          rm -rf \
            "$WORKSPACE_VENDOR"


          mkdir -p \
            "$VND_ROOT"


          rm -rf \
            "$VND_VENDOR"


          # ----------------------------------------------------
          # Mapping #1
          # ----------------------------------------------------

          ln -s \
            "$MODULES_DIR/vendor" \
            "$WORKSPACE_VENDOR"


          # ----------------------------------------------------
          # Mapping #2
          # ----------------------------------------------------

          ln -s \
            "$MODULES_DIR/vendor" \
            "$VND_VENDOR"


          # ----------------------------------------------------
          # Show mappings
          # ----------------------------------------------------

          echo
          echo "=============================================="
          echo " kernel_workspace/vendor"
          echo "=============================================="


          ls -la \
            "$WORKSPACE_VENDOR"


          echo
          echo "Resolved:"

          realpath \
            "$WORKSPACE_VENDOR"


          echo
          echo "=============================================="
          echo " vnd/vendor"
          echo "=============================================="


          ls -la \
            "$VND_VENDOR"


          echo
          echo "Resolved:"

          realpath \
            "$VND_VENDOR"


          # ----------------------------------------------------
          # Critical OPPO source paths
          # ----------------------------------------------------

          echo
          echo "=============================================="
          echo " Required OPPO components"
          echo "=============================================="


          required_files=(

            "kernel/sched_assist/Kconfig"

            "kernel/locking/klockopt/Kconfig"

            "drivers/base/kernelFwUpdate/Kconfig"

          )


          for file in "${required_files[@]}"; do

            echo
            echo "Checking:"
            echo "  $file"


            if [ ! -f "$KERNEL_DIR/$file" ]; then

              echo "::error::Missing OPPO source:"
              echo "::error::$file"


              echo
              echo "Parent directory:"


              ls -la \
                "$KERNEL_DIR/$(dirname "$file")" \
                || true


              exit 1

            fi


            echo "OK:"

            realpath \
              "$KERNEL_DIR/$file"

          done


          # ----------------------------------------------------
          # Broken symlink report
          # ----------------------------------------------------

          echo
          echo "=============================================="
          echo " Broken symlinks"
          echo "=============================================="


          find "$KERNEL_DIR" \
            -xtype l \
            -print \
            2>/dev/null \
            | tee "$WORKSPACE/broken-symlinks.txt" \
            || true


          echo
          echo "Broken symlink count:"

          wc -l \
            "$WORKSPACE/broken-symlinks.txt" \
            || true


          echo
          echo "=============================================="
          echo " OPPO vendor integration ready"
          echo "=============================================="


      # ========================================================
      # ReSukiSU
      # ========================================================

      - name: Install ReSukiSU

        if: env.KSU_VARIANT != 'none'

        shell: bash

        run: |
          set -euo pipefail

          bash scripts/kernelsu.sh


      # ========================================================
      # OPPO-specific ReSukiSU hooks
      # ========================================================

      - name: Apply Reno7 SE ReSukiSU 4.19 hooks

        if: env.KSU_VARIANT == 'resukisu'

        shell: bash

        run: |
          set -euo pipefail

          chmod +x \
            scripts/apply_oppo_mt6877_resukisu_hooks.sh

          bash \
            scripts/apply_oppo_mt6877_resukisu_hooks.sh


      # ========================================================
      # Remaining patches
      #
      # The MT6877 hook script already applies manual hooks.
      #
      # Temporarily override KSU_HOOK_MODE_RESOLVED only for
      # patches.sh so it does NOT attempt the generic ReSukiSU
      # hook patch again.
      #
      # KSU_HOOK_MODE itself remains manual and build.sh will
      # therefore still enable CONFIG_KSU_MANUAL_HOOK.
      #
      # path_umount remains enabled.
      # ========================================================

      - name: Apply remaining kernel patches

        shell: bash

        run: |
          set -euo pipefail

          KSU_HOOK_MODE_RESOLVED=none \
            bash scripts/patches.sh all


      # ========================================================
      # Final ReSukiSU source verification
      # ========================================================

      - name: Verify ReSukiSU integration

        if: env.KSU_VARIANT == 'resukisu'

        shell: bash

        run: |
          set -euo pipefail


          echo "=============================================="
          echo " ReSukiSU Integration Verification"
          echo "=============================================="


          if [ ! -d "$KERNEL_DIR/KernelSU" ]; then

            echo "::error::KernelSU source directory missing."

            exit 1

          fi


          grep -q \
            "ksu_handle_execveat" \
            "$KERNEL_DIR/fs/exec.c"


          grep -q \
            "ksu_handle_faccessat" \
            "$KERNEL_DIR/fs/open.c"


          grep -q \
            "ksu_handle_stat" \
            "$KERNEL_DIR/fs/stat.c"


          grep -q \
            "ksu_handle_newfstat_ret" \
            "$KERNEL_DIR/fs/stat.c"


          grep -q \
            "ksu_handle_fstat64_ret" \
            "$KERNEL_DIR/fs/stat.c"


          grep -q \
            "ksu_handle_sys_reboot" \
            "$KERNEL_DIR/kernel/reboot.c"


          grep -q \
            "^int path_umount" \
            "$KERNEL_DIR/fs/namespace.c"


          echo
          echo "ReSukiSU source:       OK"
          echo "execve hook:           OK"
          echo "faccessat hook:        OK"
          echo "stat hook:             OK"
          echo "newfstat return hook:  OK"
          echo "fstat64 return hook:   OK"
          echo "reboot hook:           OK"
          echo "path_umount:           OK"


          echo
          echo "=============================================="
          echo " Source integration complete"
          echo "=============================================="


      # ========================================================
      # ccache
      # ========================================================

      - name: Set up ccache

        if: env.ENABLE_CCACHE == 'true'

        uses: hendrikmuhs/ccache-action@v1.2

        with:
          key: >-
            reno7se-mt6877-${{
            env.KSU_VARIANT }}-${{
            env.KERNEL_VERSION }}

          max-size: 2G


      # ========================================================
      # Build
      # ========================================================

      - name: Build kernel

        shell: bash

        run: |
          set -euo pipefail


          LOG="$WORKSPACE/build.log"


          echo "=============================================="
          echo " Building"
          echo " OPPO Reno7 SE 5G"
          echo " MT6877"
          echo " Linux 4.19.191"
          echo " ReSukiSU"
          echo "=============================================="


          echo
          echo "Build log:"
          echo "  $LOG"


          set +e


          bash scripts/build.sh all \
            2>&1 \
            | tee "$LOG"


          STATUS=${PIPESTATUS[0]}


          set -e


          if [ "$STATUS" -ne 0 ]; then

            echo
            echo "::error::Kernel build failed with status $STATUS"


            echo
            echo "=============================================="
            echo " Last 300 build log lines"
            echo "=============================================="


            tail \
              -n 300 \
              "$LOG" \
              || true


            exit "$STATUS"

          fi


      # ========================================================
      # Final configuration verification
      # ========================================================

      - name: Verify final kernel config

        shell: bash

        run: |
          set -euo pipefail


          CONFIG="$KERNEL_DIR/out/.config"


          echo "=============================================="
          echo " Final Kernel Configuration"
          echo "=============================================="


          test -f "$CONFIG"


          echo
          echo "KernelSU:"

          grep \
            -E '^CONFIG_KSU(=|_)' \
            "$CONFIG" \
            || true


          echo
          echo "Kallsyms:"

          grep \
            -E '^CONFIG_KALLSYMS' \
            "$CONFIG" \
            || true


          echo
          echo "Module signature:"

          grep \
            -E '^CONFIG_MODULE_SIG|^# CONFIG_MODULE_SIG_FORCE' \
            "$CONFIG" \
            || true


          echo
          echo "OverlayFS:"

          grep \
            -E '^CONFIG_OVERLAY_FS=' \
            "$CONFIG" \
            || true


          echo
          echo "LTO / CFI:"

          grep \
            -E 'CONFIG_(LTO|CFI)' \
            "$CONFIG" \
            || true


          # ----------------------------------------------------
          # Mandatory ReSukiSU configuration
          # ----------------------------------------------------

          grep -q \
            '^CONFIG_KSU=y' \
            "$CONFIG"


          grep -q \
            '^CONFIG_KSU_MANUAL_HOOK=y' \
            "$CONFIG"


          grep -q \
            '^CONFIG_KALLSYMS=y' \
            "$CONFIG"


          grep -q \
            '^CONFIG_KALLSYMS_ALL=y' \
            "$CONFIG"


          # ----------------------------------------------------
          # Module signature enforcement must NOT remain forced.
          # ----------------------------------------------------

          if grep -q \
            '^CONFIG_MODULE_SIG_FORCE=y' \
            "$CONFIG"
          then

            echo "::error::CONFIG_MODULE_SIG_FORCE is still enabled."

            exit 1

          fi


          echo
          echo "Final kernel configuration verified."


      # ========================================================
      # Package
      # ========================================================

      - name: Package artifacts

        shell: bash

        run: |
          set -euo pipefail

          bash scripts/package.sh all


      # ========================================================
      # Metadata
      # ========================================================

      - name: Export build metadata

        id: meta

        shell: bash

        run: |
          {

            echo "device=${DEVICE}"

            echo "build_time=${BUILD_TIME}"

            echo "ksu_name=${KSU_NAME:-none}"

            echo "ksu_version=${KSU_VERSION_LABEL:-}"

            echo "kernel_release=${KERNEL_RELEASE:-}"

            echo "susfs_version=${SUSFS_VERSION:-disabled}"

          } >> "$GITHUB_OUTPUT"


      # ========================================================
      # Image.gz
      # ========================================================

      - name: Upload kernel image

        uses: actions/upload-artifact@v4

        with:

          name: >-
            Image.gz-ReSukiSU-Reno7SE-MT6877-${{
            env.BUILD_TIME }}

          path: >-
            kernel_workspace/android-kernel/out/arch/arm64/boot/Image.gz

          if-no-files-found: error


      # ========================================================
      # AnyKernel3
      #
      # Additional artifact only.
      #
      # Prefer stock boot.img repacking for the first real test.
      # ========================================================

      - name: Upload AnyKernel3

        uses: actions/upload-artifact@v4

        with:

          name: >-
            AnyKernel3-ReSukiSU-Reno7SE-MT6877-${{
            env.BUILD_TIME }}

          path: kernel_workspace/AnyKernel3/*

          if-no-files-found: error


      # ========================================================
      # DTBO
      # ========================================================

      - name: Upload DTBO image

        if: env.CHECK_DTBO_IS_OK == 'true'

        uses: actions/upload-artifact@v4

        with:

          name: >-
            dtbo-Reno7SE-MT6877-${{
            env.BUILD_TIME }}

          path: >-
            kernel_workspace/android-kernel/out/arch/arm64/boot/dtbo.img

          if-no-files-found: error


      # ========================================================
      # boot.img
      # ========================================================

      - name: Upload boot image

        if: env.MAKE_BOOT_IMAGE_IS_OK == 'true'

        uses: actions/upload-artifact@v4

        with:

          name: >-
            boot-ReSukiSU-Reno7SE-MT6877-${{
            env.BUILD_TIME }}

          path: kernel_workspace/boot.img

          if-no-files-found: error


      # ========================================================
      # Failure diagnostics
      # ========================================================

      - name: Upload build diagnostics

        if: failure()

        uses: actions/upload-artifact@v4

        with:

          name: >-
            Reno7SE-MT6877-error-${{
            github.run_number }}

          if-no-files-found: ignore

          path: |
            kernel_workspace/build.log
            kernel_workspace/broken-symlinks.txt
            kernel_workspace/android-kernel/out/.config
            kernel_workspace/android-kernel/out/include/generated/autoconf.h
            kernel_workspace/android-kernel/arch/arm64/configs/k6877v1_64_k419_defconfig


  # ============================================================
  # Optional GitHub Release
  # ============================================================

  release:

    name: Publish Reno7 SE kernel release

    needs:
      - build

    if: inputs.publish_release

    runs-on: ubuntu-22.04


    permissions:
      contents: write


    steps:


      - name: Download artifacts

        uses: actions/download-artifact@v4

        with:
          path: artifacts
          merge-multiple: false


      - name: Prepare release files

        shell: bash

        run: |
          set -euo pipefail


          mkdir -p release


          shopt -s nullglob


          # ----------------------------------------------------
          # AnyKernel3
          # ----------------------------------------------------

          for dir in artifacts/AnyKernel3*/; do

            name=$(basename "${dir%/}")


            echo "Packing:"
            echo "  $name"


            (
              cd "$dir"

              zip \
                -qr9 \
                "${GITHUB_WORKSPACE}/release/${name}.zip" \
                .
            )

          done


          # ----------------------------------------------------
          # Images
          # ----------------------------------------------------

          for file in \
            artifacts/*/Image \
            artifacts/*/Image.gz \
            artifacts/*/Image.gz-dtb \
            artifacts/*/boot.img \
            artifacts/*/dtbo.img

          do

            if [ -f "$file" ]; then

              cp \
                "$file" \
                release/

            fi

          done


          echo
          echo "=============================================="
          echo " Release files"
          echo "=============================================="


          ls -lah release/


      - name: Create GitHub Release

        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8

        with:

          tag_name: >-
            Reno7SE-MT6877-${{
            needs.build.outputs.build_time }}

          name: >-
            Reno7 SE 5G
            · ReSukiSU
            · Linux 4.19.191
            · ${{ needs.build.outputs.build_time }}

          body: |
            ## OPPO Reno7 SE 5G Custom Kernel

            | Item | Value |
            | --- | --- |
            | Device | OPPO Reno7 SE 5G |
            | SoC | MediaTek MT6877 |
            | Kernel | `${{ needs.build.outputs.kernel_release }}` |
            | Root | `${{ needs.build.outputs.ksu_name }}` |
            | Root Version | `${{ needs.build.outputs.ksu_version }}` |
            | SUSFS | disabled |

            ### Source

            Kernel:

            `oppo-source/android_kernel_oppo_mt6877`

            Branch:

            `oppo/mt6877_t_13.1.0_reno7_se_5g`

            Vendor/modules:

            `oppo-source/android_kernel_modules_oppo_mt6877`

            ### Root

            - ReSukiSU
            - Manual syscall hooks
            - OPPO MT6877-specific 4.19 integration
            - path_umount backport

            ### Current safety/compatibility settings

            - SUSFS disabled
            - KPM disabled
            - LTO/CFI stock configuration preserved
            - kernel LOCALVERSION preserved
            - MODULE_SIG support retained
            - MODULE_SIG_FORCE disabled

            ### Flashing

            For the first test, repacking the exact stock boot.img
            is preferred over directly flashing the generic AnyKernel3 ZIP.

            Keep the original stock boot.img before testing.

          files: release/*
